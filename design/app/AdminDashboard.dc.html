<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
  <style>
    :root{
      --bg: oklch(97% 0.006 255); --surface: oklch(100% 0 0); --surface-alt: oklch(95% 0.008 255);
      --border: oklch(88% 0.008 255); --text: oklch(20% 0.02 255); --text-secondary: oklch(44% 0.014 255);
      --text-muted: oklch(58% 0.01 255); --primary: oklch(33% 0.09 255); --primary-soft: oklch(93% 0.025 255);
      --success: oklch(58% 0.13 150); --success-soft: oklch(94% 0.035 150);
      --danger: oklch(56% 0.17 25); --danger-soft: oklch(94% 0.03 25);
      --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      --font-display: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    *{ box-sizing:border-box; } body{ margin:0; font-family:var(--font-body); color:var(--text); background:var(--bg); }
    a{ color:var(--primary); text-decoration:none; }
    @media (max-width:900px){ .admin-nav{ display:none !important; } }
  </style>
</helmet>

<div>
  <header style="background:var(--primary);color:#fff;">
    <div style="max-width:1280px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
      <div style="display:flex;align-items:center;gap:32px;">
        <div style="display:flex;align-items:center;gap:9px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-2.9 8.4-7 9.7C7.9 19.4 5 15.5 5 11V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
          <span style="font-family:var(--font-display);font-weight:700;font-size:16px;">올케어안전플랫폼</span>
          <span style="background:rgba(255,255,255,0.16);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;">관리자</span>
        </div>
        <nav class="admin-nav" style="display:flex;align-items:center;gap:22px;">
          <a href="admin-dashboard.html" style="font-size:13.5px;font-weight:700;color:#fff;">대시보드</a>
          <a href="member-management.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">회원관리</a>
          <a href="api-credentials.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">API 관리</a>
          <a href="subscription-billing.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">결제관리</a>
          <a href="inquiry-management.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">문의관리</a>
        </nav>
      </div>
      <a href="admin-login.html" style="font-size:13px;color:rgba(255,255,255,0.8);">로그아웃</a>
    </div>
  </header>

  <main style="max-width:1280px;margin:0 auto;padding:40px 40px 88px;">
    <h1 style="font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text);margin:0 0 6px;">대시보드</h1>
    <p style="font-size:13.5px;color:var(--text-muted);margin:0 0 28px;">* 아래 수치는 서비스 연동 전 데모 데이터입니다</p>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:32px;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;">
        <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px;">전체 회원</div>
        <div style="font-size:26px;font-weight:700;color:var(--text);">128명</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;">
        <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px;">구독중 회원</div>
        <div style="font-size:26px;font-weight:700;color:var(--text);">94명</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;">
        <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px;">답변 대기 문의 <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:5px;height:5px;border-radius:999px;background:var(--danger);"></span><span style="font-size:11px;color:var(--danger);font-weight:600;">(긴급)</span></span></div>
        <div style="font-size:26px;font-weight:700;color:var(--danger);">3건</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;">
        <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px;">연동 실패 API <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:5px;height:5px;border-radius:999px;background:var(--danger);"></span><span style="font-size:11px;color:var(--danger);font-weight:600;">(점검필요)</span></span></div>
        <div style="font-size:26px;font-weight:700;color:var(--danger);">1건</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:20px;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;">
        <h2 style="font-size:15px;font-weight:700;color:var(--text);margin:0 0 16px;">발주처 API 연동 상태</h2>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-alt);border-radius:8px;">
            <span style="font-size:13.5px;color:var(--text);">OO교육청</span>
            <span style="background:var(--success-soft);color:var(--success);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;">연동 정상</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-alt);border-radius:8px;">
            <span style="font-size:13.5px;color:var(--text);">한국전력공사</span>
            <span style="background:var(--danger-soft);color:var(--danger);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;">연동 실패</span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface-alt);border-radius:8px;">
            <span style="font-size:13.5px;color:var(--text);">OO도로시설공단</span>
            <span style="background:var(--success-soft);color:var(--success);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;">연동 정상</span>
          </div>
        </div>
        <a href="api-credentials.html" style="display:inline-block;margin-top:14px;font-size:13px;font-weight:600;color:var(--primary);">전체 API 관리 →</a>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;">
        <h2 style="font-size:15px;font-weight:700;color:var(--text);margin:0 0 16px;">최근 문의</h2>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div style="font-size:13.5px;color:var(--text);">구독 결제가 반영되지 않습니다</div>
          <div style="font-size:12.5px;color:var(--text-muted);">2026-08-27 · 답변 대기</div>
        </div>
        <a href="inquiry-management.html" style="display:inline-block;margin-top:14px;font-size:13px;font-weight:600;color:var(--primary);">문의 관리로 이동 →</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
