<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
  <style>
    :root{
      --bg: oklch(97% 0.006 255); --surface: oklch(100% 0 0); --surface-alt: oklch(95% 0.008 255);
      --border: oklch(88% 0.008 255); --text: oklch(20% 0.02 255); --text-secondary: oklch(44% 0.014 255);
      --text-muted: oklch(58% 0.01 255); --primary: oklch(33% 0.09 255); --primary-strong: oklch(24% 0.09 255);
      --primary-soft: oklch(93% 0.025 255);
      --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      --font-display: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    *{ box-sizing:border-box; } body{ margin:0; font-family:var(--font-body); color:var(--text); background:var(--bg); }
    a{ color:var(--primary); text-decoration:none; }
    input{ font-family:var(--font-body); }
    ::placeholder{ color:var(--text-muted); }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="max-width:400px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px;box-shadow:0 1px 2px rgba(15,23,42,0.05);">
    <div style="display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:8px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-2.9 8.4-7 9.7C7.9 19.4 5 15.5 5 11V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      <span style="font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--text);">올케어안전플랫폼</span>
    </div>
    <div style="display:flex;justify-content:center;margin-bottom:24px;">
      <span style="background:var(--primary);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:0.04em;">관리자 전용</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:13px;font-weight:600;color:var(--text);">관리자 아이디</label>
        <input type="text" placeholder="admin ID" style="border:1px solid var(--border);border-radius:9px;padding:12px 14px;font-size:14px;outline:none;">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:13px;font-weight:600;color:var(--text);">비밀번호</label>
        <input type="password" placeholder="비밀번호 입력" style="border:1px solid var(--border);border-radius:9px;padding:12px 14px;font-size:14px;outline:none;">
      </div>
      <a href="admin-dashboard.html" style="background:var(--primary);color:#fff;text-align:center;padding:13px;border-radius:9px;font-weight:700;font-size:14.5px;margin-top:8px;">관리자 로그인</a>
    </div>

    <p style="font-size:12px;color:var(--text-muted);text-align:center;margin:20px 0 0;">관리자 계정은 회원가입으로 생성되지 않으며, 운영자가 사전에 발급합니다.</p>
    <div style="text-align:center;margin-top:12px;">
      <a href="login.html" style="font-size:12.5px;color:var(--text-muted);">일반 회원 로그인은 여기로</a>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
