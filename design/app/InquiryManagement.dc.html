<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
  <style>
    :root{
      --bg: oklch(97% 0.006 255); --surface: oklch(100% 0 0); --surface-alt: oklch(95% 0.008 255);
      --border: oklch(88% 0.008 255); --text: oklch(20% 0.02 255); --text-secondary: oklch(44% 0.014 255);
      --text-muted: oklch(58% 0.01 255); --primary: oklch(33% 0.09 255); --primary-soft: oklch(93% 0.025 255);
      --success: oklch(58% 0.13 150); --success-soft: oklch(94% 0.035 150);
      --warn: oklch(63% 0.13 75); --warn-soft: oklch(94% 0.035 80);
      --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      --font-display: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    *{ box-sizing:border-box; } body{ margin:0; font-family:var(--font-body); color:var(--text); background:var(--bg); }
    a{ color:var(--primary); text-decoration:none; }
    button, textarea{ font-family:var(--font-body); }
    ::placeholder{ color:var(--text-muted); }
    @media (max-width:900px){ .admin-nav{ display:none !important; } }
  </style>
</helmet>

<div>
  <header style="background:var(--primary);color:#fff;">
    <div style="max-width:1280px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
      <div style="display:flex;align-items:center;gap:32px;">
        <div style="display:flex;align-items:center;gap:9px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-2.9 8.4-7 9.7C7.9 19.4 5 15.5 5 11V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
          <span style="font-family:var(--font-display);font-weight:700;font-size:16px;">올케어안전플랫폼</span>
          <span style="background:rgba(255,255,255,0.16);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;">관리자</span>
        </div>
        <nav class="admin-nav" style="display:flex;align-items:center;gap:22px;">
          <a href="admin-dashboard.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">대시보드</a>
          <a href="member-management.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">회원관리</a>
          <a href="api-credentials.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">API 관리</a>
          <a href="subscription-billing.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">결제관리</a>
          <a href="inquiry-management.html" style="font-size:13.5px;font-weight:700;color:#fff;">문의관리</a>
        </nav>
      </div>
      <a href="admin-login.html" style="font-size:13px;color:rgba(255,255,255,0.8);">로그아웃</a>
    </div>
  </header>

  <main style="max-width:960px;margin:0 auto;padding:40px 40px 88px;">
    <h1 style="font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text);margin:0 0 24px;">문의 관리</h1>

    <div style="display:flex;gap:6px;background:var(--surface-alt);padding:4px;border-radius:9px;width:fit-content;margin-bottom:20px;">
      <button onClick="{{selectAll}}" style="{{allTabStyle}}">전체 ({{allCount}})</button>
      <button onClick="{{selectPending}}" style="{{pendingTabStyle}}">답변대기 ({{pendingCount}})</button>
      <button onClick="{{selectAnswered}}" style="{{answeredTabStyle}}">답변완료 ({{answeredCount}})</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <sc-for list="{{filteredInquiries}}" as="inq" hint-placeholder-count="3">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px;">
            <div>
              <div style="font-size:14.5px;font-weight:700;color:var(--text);">{{inq.title}}</div>
              <div style="font-size:12.5px;color:var(--text-muted);margin-top:3px;">{{inq.company}} · {{inq.date}}</div>
            </div>
            <span style="{{inq.statusStyle}}">{{inq.statusLabel}}</span>
          </div>
          <p style="font-size:13.5px;line-height:1.6;color:var(--text-secondary);margin:0 0 12px;">{{inq.body}}</p>
          <sc-if value="{{inq.hasAnswer}}" hint-placeholder-val="{{false}}">
            <div style="background:var(--primary-soft);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--text);">
              <span style="font-weight:700;color:var(--primary);">답변: </span>{{inq.answer}}
            </div>
          </sc-if>
          <sc-if value="{{inq.needsAnswer}}" hint-placeholder-val="{{false}}">
            <div style="display:flex;flex-direction:column;gap:8px;">
              <textarea placeholder="답변을 입력해 주세요" rows="3" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;resize:vertical;"></textarea>
              <button style="align-self:flex-end;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;">답변 등록</button>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.rawInquiries = [
      { title: '계획서 작성 중 항목이 초기화됐어요', company: 'OO건설(주)', date: '2026-08-20', body: 'OO초등학교 증축공사 계획서를 작성하다가 3단계에서 저장 후 다시 들어왔더니 입력했던 항목이 비어있었습니다.', status: 'answered', answer: '일시적인 저장 지연 문제로, 현재는 정상 복구되었습니다.' },
      { title: '구독 결제가 반영되지 않습니다', company: '서울전기설비', date: '2026-08-27', body: '어제 구독 결제를 완료했는데 여전히 미구독으로 표시됩니다. 확인 부탁드립니다.', status: 'pending' },
      { title: '발주처 목록에 없는 기관 공고를 찾고 있어요', company: '한빛토건', date: '2026-08-28', body: '저희가 입찰하려는 OO군청 공고가 검색되지 않습니다. 해당 기관도 연동 가능한가요?', status: 'pending' }
    ];
    this.state = { filter: 'all' };
  }
  renderVals() {
    const state = this.state;
    const statusStyleFor = (status) => status === 'answered'
      ? 'background:var(--success-soft);color:var(--success);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;'
      : 'background:var(--warn-soft);color:var(--warn);font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;';

    const decorated = this.rawInquiries.map((inq) => ({
      ...inq,
      statusLabel: inq.status === 'answered' ? '답변완료' : '답변대기',
      statusStyle: statusStyleFor(inq.status),
      hasAnswer: inq.status === 'answered',
      needsAnswer: inq.status === 'pending',
      answer: inq.answer ?? ''
    }));

    const filteredInquiries = decorated.filter((inq) => {
      if (state.filter === 'pending') return inq.status === 'pending';
      if (state.filter === 'answered') return inq.status === 'answered';
      return true;
    });

    const tabStyle = (active) => active
      ? 'background:var(--surface);color:var(--text);border:none;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,0.06);'
      : 'background:transparent;color:var(--text-muted);border:none;border-radius:7px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;';

    return {
      filteredInquiries,
      allCount: decorated.length,
      pendingCount: decorated.filter((i) => i.status === 'pending').length,
      answeredCount: decorated.filter((i) => i.status === 'answered').length,
      allTabStyle: tabStyle(state.filter === 'all'),
      pendingTabStyle: tabStyle(state.filter === 'pending'),
      answeredTabStyle: tabStyle(state.filter === 'answered'),
      selectAll: () => this.setState({ filter: 'all' }),
      selectPending: () => this.setState({ filter: 'pending' }),
      selectAnswered: () => this.setState({ filter: 'answered' })
    };
  }
}
</script>
</body>
</html>
