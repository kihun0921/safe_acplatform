<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
  <style>
    :root{
      --bg: oklch(98% 0.004 250); --surface: oklch(100% 0 0); --surface-alt: oklch(96.5% 0.006 250);
      --border: oklch(90% 0.006 250); --text: oklch(22% 0.015 255); --text-secondary: oklch(46% 0.012 255);
      --text-muted: oklch(60% 0.008 255); --primary: oklch(33% 0.09 255); --primary-strong: oklch(24% 0.09 255);
      --primary-soft: oklch(94% 0.02 255); --danger: oklch(56% 0.17 25); --danger-soft: oklch(94% 0.03 25);
      --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      --font-display: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    *{ box-sizing:border-box; } body{ margin:0; font-family:var(--font-body); color:var(--text); background:var(--bg); }
    a{ color:var(--primary); text-decoration:none; }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;">
  <header style="background:var(--surface);border-bottom:1px solid var(--border);height:72px;display:flex;align-items:center;">
    <div style="max-width:1200px;margin:0 auto;padding:0 40px;width:100%;">
      <a href="main.html" style="display:flex;align-items:center;gap:9px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-2.9 8.4-7 9.7C7.9 19.4 5 15.5 5 11V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
        <span style="font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text);">올케어안전플랫폼</span>
      </a>
    </div>
  </header>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;">
    <div style="max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px;">
      <div style="width:64px;height:64px;border-radius:16px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
      </div>
      <h1 style="font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text);margin:0;">로그인이 필요한 페이지입니다</h1>
      <p style="font-size:14.5px;line-height:1.7;color:var(--text-secondary);margin:0;">계획서 작성, 내 문서함, 문의하기 등은 로그인한 회원만 이용할 수 있습니다. 로그인 후 다시 시도해 주세요.</p>
      <div style="display:flex;gap:10px;width:100%;margin-top:8px;">
        <a href="login.html" style="flex:1;background:{{accentColor}};color:#fff;padding:13px;border-radius:9px;font-weight:700;font-size:14.5px;">로그인</a>
        <a href="signup.html" style="flex:1;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:13px;border-radius:9px;font-weight:700;font-size:14.5px;">회원가입</a>
      </div>
      <a href="main.html" style="font-size:13px;color:var(--text-muted);margin-top:4px;">메인으로 돌아가기</a>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"accentColor":{"editor":"color","default":"#c2410c","options":["#c2410c","#0f766e","#b91c1c","#7c3aed"]}}'>
class Component extends DCLogic {
  renderVals() { return { accentColor: this.props.accentColor ?? '#c2410c' }; }
}
</script>
</body>
</html>
