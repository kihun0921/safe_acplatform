<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
  <style>
    :root{
      --bg: oklch(98% 0.004 250); --surface: oklch(100% 0 0); --surface-alt: oklch(96.5% 0.006 250);
      --border: oklch(90% 0.006 250); --text: oklch(22% 0.015 255); --text-secondary: oklch(46% 0.012 255);
      --text-muted: oklch(60% 0.008 255); --primary: oklch(33% 0.09 255); --primary-soft: oklch(94% 0.02 255);
      --success: oklch(58% 0.13 150); --success-soft: oklch(94% 0.035 150);
      --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      --font-display: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    *{ box-sizing:border-box; } body{ margin:0; font-family:var(--font-body); color:var(--text); background:var(--bg); }
    a{ color:var(--primary); text-decoration:none; }
    button{ font-family:var(--font-body); }
    .hamburger-btn{ display:none; }
    @media (max-width:960px){ .nav-links{ display:none !important; } .hamburger-btn{ display:flex !important; } }
  </style>
</helmet>

<div>
  <header style="position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);">
    <div style="max-width:1200px;margin:0 auto;padding:0 40px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
      <div style="display:flex;align-items:center;gap:36px;">
        <a href="main.html" style="display:flex;align-items:center;gap:9px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-2.9 8.4-7 9.7C7.9 19.4 5 15.5 5 11V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
          <span style="font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text);">올케어안전플랫폼</span>
        </a>
        <nav class="nav-links" style="display:flex;align-items:center;gap:28px;">
          <a href="main.html#announcements" style="font-size:14px;font-weight:500;color:var(--text-secondary);">공고검색</a>
          <a href="my-documents.html" style="font-size:14px;font-weight:700;color:var(--primary);">내 문서함</a>
          <a href="inquiry-list.html" style="font-size:14px;font-weight:500;color:var(--text-secondary);">문의하기</a>
        </nav>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <a href="my-page.html" style="display:flex;align-items:center;gap:8px;">
          <span style="width:30px;height:30px;border-radius:999px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">담</span>
          <span style="font-size:13.5px;font-weight:600;color:var(--text);">담당자님</span>
        </a>
        <a href="main.html" style="font-size:13.5px;color:var(--text-muted);">로그아웃</a>
        <button class="hamburger-btn" onClick="{{toggleMobileMenu}}" style="align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile nav drawer -->
  <sc-if value="{{mobileMenuOpen}}" hint-placeholder-val="{{false}}">
    <div style="position:fixed;inset:0;top:72px;background:oklch(20% 0.02 255 / 0.35);z-index:250;" onClick="{{closeMobileMenu}}"></div>
    <div style="position:fixed;top:72px;right:0;bottom:0;width:min(320px,85vw);background:var(--surface);border-left:1px solid var(--border);z-index:260;padding:24px;display:flex;flex-direction:column;gap:8px;">
      <a href="main.html#announcements" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);">공고검색</a>
      <a href="my-documents.html" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);">내 문서함</a>
      <a href="inquiry-list.html" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);">문의하기</a>
      <a href="my-page.html" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);">마이페이지</a>
      <a href="main.html" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);">로그아웃</a>
    </div>
  </sc-if>

  <main style="max-width:960px;margin:0 auto;padding:48px 40px 88px;">
    <h1 style="font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--text);margin:0 0 24px;">내 문서함</h1>

    <div style="display:flex;gap:6px;background:var(--surface-alt);padding:4px;border-radius:9px;width:fit-content;margin-bottom:24px;">
      <button onClick="{{selectProgressTab}}" style="{{progressTabStyle}}">작성중 ({{progressCount}})</button>
      <button onClick="{{selectDoneTab}}" style="{{doneTabStyle}}">완료 ({{doneCount}})</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <sc-if value="{{isProgressTab}}" hint-placeholder-val="{{true}}">
        <sc-for list="{{progressDocs}}" as="doc" hint-placeholder-count="3">
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
            <div style="flex:1;min-width:240px;">
              <div style="font-size:15px;font-weight:700;color:var(--text);">{{doc.title}}</div>
              <div style="font-size:13px;color:var(--text-muted);margin-top:3px;">{{doc.org}} · {{doc.step}}단계 진행 중</div>
            </div>
            <div style="width:200px;display:flex;flex-direction:column;gap:6px;">
              <div style="height:6px;background:var(--border);border-radius:999px;overflow:hidden;" role="progressbar" aria-valuenow="{{doc.percent}}" aria-valuemin="0" aria-valuemax="100">
                <div style="height:100%;background:{{accentColor}};border-radius:999px;width:{{doc.percentWidth}};"></div>
              </div>
              <span style="font-size:12px;color:var(--text-muted);text-align:right;">{{doc.percent}}% 작성중</span>
            </div>
            <a href="main.html#announcements" style="background:var(--primary-soft);color:var(--primary);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:700;white-space:nowrap;">이어서 작성</a>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{isDoneTab}}" hint-placeholder-val="{{false}}">
        <sc-for list="{{doneDocs}}" as="doc" hint-placeholder-count="3">
          <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
            <div style="flex:1;min-width:240px;">
              <div style="font-size:15px;font-weight:700;color:var(--text);">{{doc.title}}</div>
              <div style="font-size:13px;color:var(--text-muted);margin-top:3px;">{{doc.org}} · {{doc.completedDate}} 완료</div>
            </div>
            <div style="display:flex;gap:8px;">
              <button style="display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="1.8"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>
                PDF
              </button>
              <button style="display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>
                DOCX
              </button>
            </div>
          </div>
        </sc-for>
      </sc-if>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"accentColor":{"editor":"color","default":"#c2410c","options":["#c2410c","#0f766e","#b91c1c","#7c3aed"]}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dashboardTab: 'progress', mobileMenuOpen: false };
  }
  renderVals() {
    const accentColor = this.props.accentColor ?? '#c2410c';
    const state = this.state;

    const progressDocs = [
      { title: 'OO초등학교 증축공사 계획서', org: 'OO교육청', percent: 68, step: 3 },
      { title: 'OO변전소 개보수 공사 계획서', org: '한국전력공사', percent: 32, step: 2 },
      { title: 'OO지방도로 확장 공사 계획서', org: 'OO도로시설공단', percent: 12, step: 1 }
    ].map((d) => ({ ...d, percentWidth: `${d.percent}%` }));

    const doneDocs = [
      { title: 'OO청사 리모델링 공사 계획서', org: 'OO시청', completedDate: '2026-08-12' },
      { title: 'OO정수장 설비 교체 계획서', org: 'OO수자원공사', completedDate: '2026-07-30' },
      { title: 'OO물류센터 신축 공사 계획서', org: 'OO물류공사', completedDate: '2026-07-05' }
    ];

    const tabStyle = (active) => active
      ? `background:var(--surface);color:var(--text);border:none;border-radius:7px;padding:9px 18px;font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,0.06);`
      : `background:transparent;color:var(--text-muted);border:none;border-radius:7px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;`;

    return {
      accentColor,
      isProgressTab: state.dashboardTab === 'progress',
      isDoneTab: state.dashboardTab === 'done',
      progressTabStyle: tabStyle(state.dashboardTab === 'progress'),
      doneTabStyle: tabStyle(state.dashboardTab === 'done'),
      progressCount: progressDocs.length,
      doneCount: doneDocs.length,
      progressDocs,
      doneDocs,
      selectProgressTab: () => this.setState({ dashboardTab: 'progress' }),
      selectDoneTab: () => this.setState({ dashboardTab: 'done' }),
      mobileMenuOpen: state.mobileMenuOpen,
      toggleMobileMenu: () => this.setState({ mobileMenuOpen: !state.mobileMenuOpen }),
      closeMobileMenu: () => this.setState({ mobileMenuOpen: false })
    };
  }
}
</script>
</body>
</html>
