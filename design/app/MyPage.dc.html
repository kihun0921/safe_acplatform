<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
  <style>
    :root{
      --bg: oklch(98% 0.004 250); --surface: oklch(100% 0 0); --surface-alt: oklch(96.5% 0.006 250);
      --border: oklch(90% 0.006 250); --text: oklch(22% 0.015 255); --text-secondary: oklch(46% 0.012 255);
      --text-muted: oklch(60% 0.008 255); --primary: oklch(33% 0.09 255); --primary-soft: oklch(94% 0.02 255);
      --success: oklch(58% 0.13 150); --success-soft: oklch(94% 0.035 150);
      --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      --font-display: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    *{ box-sizing:border-box; } body{ margin:0; font-family:var(--font-body); color:var(--text); background:var(--bg); }
    a{ color:var(--primary); text-decoration:none; }
    .hamburger-btn{ display:none; }
    @media (max-width:960px){ .nav-links{ display:none !important; } .hamburger-btn{ display:flex !important; } }
  </style>
</helmet>

<div>
  <header style="position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--border);">
    <div style="max-width:1200px;margin:0 auto;padding:0 40px;height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
      <div style="display:flex;align-items:center;gap:36px;">
        <a href="main.html" style="display:flex;align-items:center;gap:9px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-2.9 8.4-7 9.7C7.9 19.4 5 15.5 5 11V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
          <span style="font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text);">올케어안전플랫폼</span>
        </a>
        <nav class="nav-links" style="display:flex;align-items:center;gap:28px;">
          <a href="main.html#announcements" style="font-size:14px;font-weight:500;color:var(--text-secondary);">공고검색</a>
          <a href="my-documents.html" style="font-size:14px;font-weight:500;color:var(--text-secondary);">내 문서함</a>
          <a href="inquiry-list.html" style="font-size:14px;font-weight:500;color:var(--text-secondary);">문의하기</a>
        </nav>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <a href="my-page.html" style="display:flex;align-items:center;gap:8px;">
          <span style="width:30px;height:30px;border-radius:999px;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;">담</span>
          <span style="font-size:13.5px;font-weight:700;color:var(--primary);">담당자님</span>
        </a>
        <a href="main.html" style="font-size:13.5px;color:var(--text-muted);">로그아웃</a>
        <button class="hamburger-btn" onClick="{{toggleMobileMenu}}" style="align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--border);border-radius:7px;background:var(--surface);cursor:pointer;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile nav drawer -->
  <sc-if value="{{mobileMenuOpen}}" hint-placeholder-val="{{false}}">
    <div style="position:fixed;inset:0;top:72px;background:oklch(20% 0.02 255 / 0.35);z-index:250;" onClick="{{closeMobileMenu}}"></div>
    <div style="position:fixed;top:72px;right:0;bottom:0;width:min(320px,85vw);background:var(--surface);border-left:1px solid var(--border);z-index:260;padding:24px;display:flex;flex-direction:column;gap:8px;">
      <a href="main.html#announcements" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);">공고검색</a>
      <a href="my-documents.html" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);">내 문서함</a>
      <a href="inquiry-list.html" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);">문의하기</a>
      <a href="my-page.html" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);border-bottom:1px solid var(--border);">마이페이지</a>
      <a href="main.html" onClick="{{closeMobileMenu}}" style="padding:12px 8px;font-size:15px;font-weight:600;color:var(--text);">로그아웃</a>
    </div>
  </sc-if>

  <main style="max-width:680px;margin:0 auto;padding:48px 40px 88px;">
    <h1 style="font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--text);margin:0 0 24px;">마이페이지</h1>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px;">
      <h2 style="font-size:15px;font-weight:700;color:var(--text);margin:0 0 16px;">회원 정보</h2>
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--text-muted);">이메일</span><span style="color:var(--text);font-weight:600;">manager@ooconst.co.kr</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--text-muted);">소속 건설사</span><span style="color:var(--text);font-weight:600;">OO건설(주)</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--text-muted);">사업자등록번호</span><span style="color:var(--text);font-weight:600;">123-45-67890</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--text-muted);">담당자명</span><span style="color:var(--text);font-weight:600;">김담당</span></div>
        <div style="display:flex;justify-content:space-between;font-size:13.5px;"><span style="color:var(--text-muted);">연락처</span><span style="color:var(--text);font-weight:600;">010-1234-5678</span></div>
      </div>
    </div>

    <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;">
      <h2 style="font-size:15px;font-weight:700;color:var(--text);margin:0 0 16px;">구독 상태</h2>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <span style="background:var(--success-soft);color:var(--success);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;">구독중</span>
          <p style="font-size:13px;color:var(--text-muted);margin:10px 0 0;">다음 결제일: 2026-09-15</p>
        </div>
        <a href="subscription-billing-guide.html" style="font-size:13px;font-weight:600;color:var(--primary);">구독 관리 →</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mobileMenuOpen: false };
  }
  renderVals() {
    return {
      mobileMenuOpen: this.state.mobileMenuOpen,
      toggleMobileMenu: () => this.setState({ mobileMenuOpen: !this.state.mobileMenuOpen }),
      closeMobileMenu: () => this.setState({ mobileMenuOpen: false })
    };
  }
}
</script>
</body>
</html>
