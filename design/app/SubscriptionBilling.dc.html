<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
  <style>
    :root{
      --bg: oklch(97% 0.006 255); --surface: oklch(100% 0 0); --surface-alt: oklch(95% 0.008 255);
      --border: oklch(88% 0.008 255); --text: oklch(20% 0.02 255); --text-secondary: oklch(44% 0.014 255);
      --text-muted: oklch(58% 0.01 255); --primary: oklch(33% 0.09 255); --primary-soft: oklch(93% 0.025 255);
      --success: oklch(58% 0.13 150); --success-soft: oklch(94% 0.035 150);
      --danger: oklch(56% 0.17 25); --danger-soft: oklch(94% 0.03 25);
      --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      --font-display: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    *{ box-sizing:border-box; } body{ margin:0; font-family:var(--font-body); color:var(--text); background:var(--bg); }
    a{ color:var(--primary); text-decoration:none; }
    input, button{ font-family:var(--font-body); }
    table{ border-collapse:collapse; width:100%; }
    th,td{ text-align:left; padding:12px 14px; font-size:13.5px; }
    th{ color:var(--text-muted); font-weight:600; font-size:12.5px; border-bottom:1px solid var(--border); }
    tbody tr{ border-bottom:1px solid var(--border); }
    @media (max-width:900px){ .admin-nav{ display:none !important; } }
  </style>
</helmet>

<div>
  <header style="background:var(--primary);color:#fff;">
    <div style="max-width:1280px;margin:0 auto;padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:24px;">
      <div style="display:flex;align-items:center;gap:32px;">
        <div style="display:flex;align-items:center;gap:9px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-2.9 8.4-7 9.7C7.9 19.4 5 15.5 5 11V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
          <span style="font-family:var(--font-display);font-weight:700;font-size:16px;">올케어안전플랫폼</span>
          <span style="background:rgba(255,255,255,0.16);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;">관리자</span>
        </div>
        <nav class="admin-nav" style="display:flex;align-items:center;gap:22px;">
          <a href="admin-dashboard.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">대시보드</a>
          <a href="member-management.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">회원관리</a>
          <a href="api-credentials.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">API 관리</a>
          <a href="subscription-billing.html" style="font-size:13.5px;font-weight:700;color:#fff;">결제관리</a>
          <a href="inquiry-management.html" style="font-size:13.5px;font-weight:500;color:rgba(255,255,255,0.8);">문의관리</a>
        </nav>
      </div>
      <a href="admin-login.html" style="font-size:13px;color:rgba(255,255,255,0.8);">로그아웃</a>
    </div>
  </header>

  <main style="max-width:1100px;margin:0 auto;padding:40px 40px 88px;">
    <h1 style="font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text);margin:0 0 24px;">구독료 결제창 관리</h1>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:32px;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;">
        <h2 style="font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 16px;">결제 수단 설정</h2>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12.5px;color:var(--text-muted);">결제대행사(PG)</label>
            <input type="text" value="[PG사명]" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;">
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12.5px;color:var(--text-muted);">가맹점 ID</label>
            <input type="text" value="[가맹점 ID]" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;">
          </div>
          <button style="background:var(--primary);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;">저장</button>
        </div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;">
        <h2 style="font-size:14.5px;font-weight:700;color:var(--text);margin:0 0 16px;">구독 조건</h2>
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12.5px;color:var(--text-muted);">월 구독료</label>
            <input type="text" value="[가격] 원" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;">
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <label style="font-size:12.5px;color:var(--text-muted);">결제 주기</label>
            <input type="text" value="매월 자동 결제" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;">
          </div>
          <button style="background:var(--primary);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;">저장</button>
        </div>
      </div>
    </div>

    <h2 style="font-size:15px;font-weight:700;color:var(--text);margin:0 0 14px;">최근 결제 이력</h2>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;">
      <table>
        <thead><tr><th>소속 건설사</th><th>결제일</th><th>금액</th><th>결과</th></tr></thead>
        <tbody>
          <tr><td style="font-weight:600;">OO건설(주)</td><td style="color:var(--text-muted);">2026-08-15</td><td>[가격]원</td><td><span style="background:var(--success-soft);color:var(--success);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;">성공</span></td></tr>
          <tr><td style="font-weight:600;">대한종합건설</td><td style="color:var(--text-muted);">2026-08-14</td><td>[가격]원</td><td><span style="background:var(--success-soft);color:var(--success);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;">성공</span></td></tr>
          <tr><td style="font-weight:600;">서울전기설비</td><td style="color:var(--text-muted);">2026-08-10</td><td>[가격]원</td><td><span style="background:var(--danger-soft);color:var(--danger);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;">실패</span></td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</x-dc>
</body>
</html>
