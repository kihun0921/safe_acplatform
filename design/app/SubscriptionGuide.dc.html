<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
  <style>
    :root{
      --bg: oklch(98% 0.004 250); --surface: oklch(100% 0 0); --surface-alt: oklch(96.5% 0.006 250);
      --border: oklch(90% 0.006 250); --text: oklch(22% 0.015 255); --text-secondary: oklch(46% 0.012 255);
      --text-muted: oklch(60% 0.008 255); --primary: oklch(33% 0.09 255); --primary-soft: oklch(94% 0.02 255);
      --success: oklch(58% 0.13 150);
      --font-body: 'Noto Sans KR', system-ui, -apple-system, 'Malgun Gothic', sans-serif;
      --font-display: 'Noto Serif KR', 'Noto Sans KR', serif;
    }
    *{ box-sizing:border-box; } body{ margin:0; font-family:var(--font-body); color:var(--text); background:var(--bg); }
    a{ color:var(--primary); text-decoration:none; }
  </style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;">
  <header style="background:var(--surface);border-bottom:1px solid var(--border);height:72px;display:flex;align-items:center;">
    <div style="max-width:1200px;margin:0 auto;padding:0 40px;width:100%;">
      <a href="main.html" style="display:flex;align-items:center;gap:9px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-2.9 8.4-7 9.7C7.9 19.4 5 15.5 5 11V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
        <span style="font-family:var(--font-display);font-weight:700;font-size:20px;color:var(--text);">올케어안전플랫폼</span>
      </a>
    </div>
  </header>

  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;">
    <div style="max-width:460px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px;text-align:center;">
      <div style="width:56px;height:56px;border-radius:14px;background:var(--primary-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      </div>
      <h1 style="font-family:var(--font-display);font-size:21px;font-weight:700;color:var(--text);margin:0 0 10px;">구독이 필요한 기능입니다</h1>
      <p style="font-size:14px;line-height:1.7;color:var(--text-secondary);margin:0 0 24px;">공고 검색, 계획서 작성, 다운로드 등 핵심 기능은 구독 중인 회원만 이용할 수 있습니다.</p>

      <div style="background:var(--surface-alt);border-radius:12px;padding:20px;margin-bottom:24px;text-align:left;display:flex;flex-direction:column;gap:10px;">
        <div style="display:flex;align-items:center;gap:8px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg><span style="font-size:13.5px;color:var(--text);">나라장터 실공고 무제한 검색</span></div>
        <div style="display:flex;align-items:center;gap:8px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg><span style="font-size:13.5px;color:var(--text);">공고별 맞춤 계획서 단계별 작성</span></div>
        <div style="display:flex;align-items:center;gap:8px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"/></svg><span style="font-size:13.5px;color:var(--text);">완성 계획서 PDF·DOCX 다운로드</span></div>
      </div>

      <a href="#" style="display:block;background:{{accentColor}};color:#fff;padding:13px;border-radius:9px;font-weight:700;font-size:14.5px;margin-bottom:10px;">구독 시작하기</a>
      <a href="main.html" style="font-size:13px;color:var(--text-muted);">나중에 하기</a>
    </div>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"accentColor":{"editor":"color","default":"#c2410c","options":["#c2410c","#0f766e","#b91c1c","#7c3aed"]}}'>
class Component extends DCLogic {
  renderVals() { return { accentColor: this.props.accentColor ?? '#c2410c' }; }
}
</script>
</body>
</html>
